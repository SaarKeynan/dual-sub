name: Verify extension

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run verify
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dualsub-firefox
          path: .web-ext-artifacts/*.zip
